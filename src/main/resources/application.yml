server:
  port: 8080

spring:
  application:
    name: erupt-pm

  # Default profile runs on a file-backed H2 so the system boots with zero setup.
  # For production switch to MySQL — see the `mysql` profile at the bottom of this file.
  datasource:
    url: jdbc:h2:file:./data/pm;AUTO_SERVER=TRUE;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    generate-ddl: true
    database: h2
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        # Keep Hibernate 6 storing enums as varchar instead of a native enum type.
        type.enumeration.use_named: false

erupt:
  upload-path: ./data/attachment
  init-method-enum: EVERY

logging:
  level:
    xyz.erupt.pm: INFO

---
# Activate with: --spring.profiles.active=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/erupt_pm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Supply credentials through the environment, never in this file.
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
erupt:
  init-method-enum: every
